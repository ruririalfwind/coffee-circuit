name: Daily Update

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run auto-fetch script
        run: python scripts/update.py

      - name: Commit and push changes
        run: |
          git config user.name "coffee-circuit-bot"
          git config user.email "coffee-circuit-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "no data changes, skip commit"
          else
            git commit -m "chore: daily coffee event data refresh $(date +%F)"
            git push
          fi
